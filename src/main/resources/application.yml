spring:
  application:
    name: sila

  jackson:
    # El contrato del dashboard usa los nombres de columna de la base (snake_case).
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: LLANOLAT_APP
    password: ${LLANOLAT_APP_PWD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      # LLANOLAT_APP no es dueno de nada: esto solo resuelve los nombres de
      # los packages y vistas. No otorga ningun privilegio.
      connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA = LLANOLAT
      # Los procedimientos PL/SQL hacen su propio COMMIT: no usar @Transactional.
      auto-commit: true
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: sila-pool

  servlet:
    multipart:
      # Archivos subidos por el ADMIN: 10 MB de contenido (el cifrado de Drive agrega ~65 bytes, de ahi los 11 MB).
      max-file-size: 11MB
      max-request-size: 12MB

server:
  # Solo esta maquina por defecto. Para probar desde otro equipo: SILA_BIND=0.0.0.0 (y nunca en produccion sin proxy y firewall).
  address: ${SILA_BIND:127.0.0.1}
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never   # el detalle de la base no debe verlo cualquiera

logging:
  level:
    com.llanolat.sila: DEBUG

sila:
  seguridad:
    # jwt        = identidad del token de acceso. ES EL MODO POR DEFECTO, tambien en desarrollo.
    # desarrollo = la identidad viene de las cabeceras X-Usuario / X-Rol: CUALQUIERA puede
    #              ser ADMIN. Solo por excepcion explicita (SILA_MODO=desarrollo); el arranque
    #              se niega a usarlo con un perfil de produccion.
    modo: ${SILA_MODO:jwt}
    usuario-por-defecto: dev.local
    rol-por-defecto: OPERATIVO
    # Claves en base64, por variable de entorno (./arrancar.sh las carga de credenciales.txt).
    jwt-secret: ${SILA_JWT_SECRET:}
    mfa-key: ${SILA_MFA_KEY:}
    acceso-ttl: 15m
    temporal-ttl: 5m
    refresh-ttl: 12h
    # La cookie de renovacion solo viaja por HTTPS. Chrome y Firefox la aceptan en http://localhost.
    cookie-secure: ${SILA_COOKIE_SECURE:true}
    mfa-obligatorio-roles: ADMIN
  cors:
    # Origenes permitidos (separados por coma). ng serve usa :4200.
    origenes: http://localhost:4200
  archivos:
    # Archivos CIFRADOS (comprobantes en PDF y lo que sube el ADMIN). Fuera de cualquier carpeta que sirva un servidor web.
    directorio: ${SILA_DOCS_DIR:${user.home}/sila_docs}
    # Llave AES-256 (base64, 32 bytes) de los archivos y del acceso a Drive. DISTINTA de SILA_MFA_KEY. Si se pierde, los
    # archivos (tambien los de Drive) no se pueden leer: guardar una copia FUERA del servidor.
    docs-key: ${SILA_DOCS_KEY:}
    # Los movimientos de esta fecha en adelante reciben PDF si les falta (reintento automatico). Vacio = apagado.
    fecha-corte: ${SILA_DOCS_FECHA_CORTE:}
    empresa:
      nombre: ${SILA_EMPRESA_NOMBRE:LLANOLAT}
      nit: ${SILA_EMPRESA_NIT:}
      direccion: ${SILA_EMPRESA_DIRECCION:}
      telefono: ${SILA_EMPRESA_TELEFONO:}
    clamav:
      # Antivirus ClamAV (clamd). Habilitado = la subida se rechaza si clamd no responde. Apagarlo SOLO en desarrollo.
      habilitado: ${SILA_CLAMAV:true}
      host: ${SILA_CLAMAV_HOST:127.0.0.1}
      puerto: ${SILA_CLAMAV_PUERTO:3310}
      socket: ${SILA_CLAMAV_SOCKET:}
    drive:
      client-id: ${SILA_DRIVE_CLIENT_ID:}
      client-secret: ${SILA_DRIVE_CLIENT_SECRET:}
      # Debe coincidir EXACTO con el URI de redireccion registrado en Google Cloud (OAuth, aplicacion web).
      redirect-uri: ${SILA_DRIVE_REDIRECT_URI:}
      # Pagina del dashboard a la que se vuelve al terminar (opcional): se le agrega ?drive=ok o ?drive=error
      retorno: ${SILA_DRIVE_RETORNO:}
